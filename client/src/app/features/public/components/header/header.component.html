<header class="header">
  <mat-toolbar color="primary">
    <div class="container">
      <div class="logo">
        <a [routerLink]="['/']">
          <mat-icon>hotel</mat-icon>
          <span>{{ title }}</span>
        </a>
      </div>

      <div class="navigation-container">
        <nav class="navigation">
          <a mat-button routerLink="/home" routerLinkActive="active">{{ 'HOME' | translate }}</a>
          <a mat-button routerLink="/rooms" routerLinkActive="active">{{ 'ROOMS' | translate }}</a>
          <a mat-button routerLink="/amenities" routerLinkActive="active">{{ 'AMENITIES' | translate }}</a>
          <a mat-button routerLink="/contact" routerLinkActive="active">{{ 'CONTACT' | translate }}</a>
          <a mat-button routerLink="/admin" routerLinkActive="active">Admin</a>

          <button mat-icon-button [matMenuTriggerFor]="langMenu" class="lang-btn">
            <mat-icon>language</mat-icon>
          </button>
          <mat-menu #langMenu="matMenu">
            <button mat-menu-item (click)="switchLanguage('en')">English</button>
            <button mat-menu-item (click)="switchLanguage('vi')">Tiếng Việt</button>
          </mat-menu>
        </nav>
      </div>
    </div>
  </mat-toolbar>
</header>
