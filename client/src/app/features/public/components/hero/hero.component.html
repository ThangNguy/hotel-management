<section class="hero">
  <div class="hero-overlay"></div>
  <div class="hero-content">
    <div class="hero-text">
      <h1 class="animate-fade-in-up">Welcome to Luxury Hotel & Resort</h1>
      <p class="animate-fade-in-up delay-200">Experience elegance and comfort in the heart of the city.</p>
      <div class="hero-buttons animate-fade-in-up delay-400">
        <a routerLink="/rooms" class="cta-button">View Rooms</a>
        <a routerLink="/amenities" class="secondary-button">Explore Amenities</a>
      </div>
    </div>
    
    <div class="booking-form-container animate-fade-in-left delay-400">
      <mat-card class="booking-form-card">
        <mat-card-header>
          <mat-card-title>Find Your Perfect Room</mat-card-title>
        </mat-card-header>
        
        <mat-card-content>
          <form [formGroup]="bookingForm" (ngSubmit)="checkAvailability()">
            <div class="form-row">
              <mat-form-field appearance="outline">
                <mat-label>Check-in</mat-label>
                <input matInput [matDatepicker]="checkInPicker" formControlName="checkIn">
                <mat-datepicker-toggle matIconSuffix [for]="checkInPicker"></mat-datepicker-toggle>
                <mat-datepicker #checkInPicker></mat-datepicker>
                <mat-error *ngIf="bookingForm.controls.checkIn.invalid">
                  Required
                </mat-error>
              </mat-form-field>
              
              <mat-form-field appearance="outline">
                <mat-label>Check-out</mat-label>
                <input matInput [matDatepicker]="checkOutPicker" formControlName="checkOut">
                <mat-datepicker-toggle matIconSuffix [for]="checkOutPicker"></mat-datepicker-toggle>
                <mat-datepicker #checkOutPicker></mat-datepicker>
                <mat-error *ngIf="bookingForm.controls.checkOut.invalid">
                  Required
                </mat-error>
              </mat-form-field>
            </div>
            
            <div class="form-row">
              <mat-form-field appearance="outline">
                <mat-label>Adults</mat-label>
                <input matInput type="number" min="1" max="10" formControlName="adults">
                <mat-icon matSuffix>person</mat-icon>
                <mat-error *ngIf="bookingForm.controls.adults.hasError('required')">Required</mat-error>
                <mat-error *ngIf="bookingForm.controls.adults.hasError('min')">Min 1</mat-error>
                <mat-error *ngIf="bookingForm.controls.adults.hasError('max')">Max 10</mat-error>
              </mat-form-field>
              
              <mat-form-field appearance="outline">
                <mat-label>Children</mat-label>
                <input matInput type="number" min="0" max="10" formControlName="children">
                <mat-icon matSuffix>child_care</mat-icon>
                <mat-error *ngIf="bookingForm.controls.children.hasError('min')">Cannot be negative</mat-error>
                <mat-error *ngIf="bookingForm.controls.children.hasError('max')">Max 10</mat-error>
              </mat-form-field>
            </div>
            
            <button type="submit" class="search-button">
              <mat-icon>search</mat-icon>
              Check Availability
            </button>
          </form>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
</section>

<!-- Rest of landing page components -->
<app-rooms></app-rooms>
<app-amenities></app-amenities>
<app-contact></app-contact>
